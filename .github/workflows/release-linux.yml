name: Linux release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run dist:linux -- --publish never

      - name: Keep packages as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: crunchi-linux
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
